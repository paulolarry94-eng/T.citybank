# Downloads Dukascopy 1-minute bid data for the declared breadth markets (OPEN_QUESTIONS Q4) on GitHub's servers
# and commits it to data/. One job per market; a final job commits whatever finished. Re-running the workflow
# fetches only the years still missing (each job checks out the files already on the branch for its market).
name: fetch-breadth-data
on:
  push:
    branches: [claude/loving-davinci-uzjf3z]
    paths: [.github/workflows/fetch-data.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch-breadth-data
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        sym: [US500, GER40, WTI, XAGUSD]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            data/${{ matrix.sym }}_M1_bid_*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Download ${{ matrix.sym }} 2011-2025
        run: python tools/dukascopy_m1.py ${{ matrix.sym }} 2011 2025
      - name: List files
        run: ls -la data | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.sym }}
          path: data/*.npz
          if-no-files-found: warn
          retention-days: 7
  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: data
          merge-multiple: true
      - name: Commit new data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.npz
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Breadth data from Dukascopy (US500, GER40, WTI, XAGUSD), downloaded by GitHub Actions"
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
