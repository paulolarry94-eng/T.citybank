width:1}\n.rp-tip{position:absolute;pointer-events:none;background:var(--cds-surface-popover);border:1px solid var(--cds-border);box-shadow:var(--cds-shadow-popover);border-radius:var(--cds-radius);padding:var(--cds-pad-xs) var(--cds-pad-sm);font-size:var(--cds-font-size-caption);color:var(--color-fg);white-space:nowrap;z-index:3;display:none;font-variant-numeric:tabular-nums;line-height:1.5}\n.rp-tip b{font-weight:var(--cds-font-weight-medium)}\n.rp-tip .k{color:var(--cds-text-secondary)}\n.rp-scroll{overflow-x:auto;min-width:0}\n.rp-table{border-collapse:collapse;font-size:var(--cds-font-size-caption);font-variant-numeric:tabular-nums;width:100%}\n.rp-table th{text-align:right;font-weight:var(--cds-font-weight-medium);color:var(--color-fg-muted);padding:var(--cds-pad-xs) var(--cds-pad-sm);border-bottom:1px solid var(--color-border-line);white-space:nowrap;vertical-align:bottom}\n.rp-table td{text-align:right;padding:var(--cds-pad-xs) var(--cds-pad-sm);border-bottom:1px solid var(--color-border-line);white-space:nowrap}\n.rp-table .l{text-align:left}\n.rp-table tr.rp-grp td{color:var(--color-fg);font-weight:var(--cds-font-weight-medium);padding-top:var(--cds-pad-md)}\n.rp-legend{display:flex;flex-wrap:wrap;gap:var(--cds-gap-xs) var(--cds-gap-md);font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);margin-bottom:var(--cds-gap-sm)}\n.rp-sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}\n.rp-ring{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--cds-chart-muted)}\n.rp-note{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);border-left:2px solid var(--color-border-line);padding-left:var(--cds-pad-sm);margin:0;max-width:82ch;line-height:1.5}\n.rp-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:var(--cds-gap-md)}\n.rp-details summary{cursor:pointer;font-weight:var(--cds-font-weight-medium)}\n.rp-details ul{margin:var(--cds-gap-sm) 0 0;padding-left:1.2em;line-height:1.55;max-width:82ch}\n.rp-details li{margin-bottom:var(--cds-gap-xs)}\n.rp-tag{display:inline-block;font-size:var(--cds-font-size-caption);font-weight:var(--cds-font-weight-medium);border:1px solid var(--color-bad);color:var(--color-bad);border-radius:999px;padding:0 var(--cds-pad-sm);vertical-align:2px;margin-left:var(--cds-gap-xs)}\n.rp-tag.ok{border-color:var(--color-ok);color:var(--color-ok)}\n.rp [data-dash-source-state=refreshing]{opacity:.5}\n.rp [hidden]{display:none !important}\n<\/style>\n\n<div class=\"rp\" id=\"report\">\n\n<header class=\"rp-sec\" id=\"top\">\n  <h1 class=\"rp-title\">Timeless 10 + v2: portfolio backtest report<\/h1>\n  <p class=\"rp-sub\"><span data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=legs\" data-fmt=\"int\">\u2014<\/span> rule-based legs on <span data-draw=\"val\" data-src=\"leg_markets\" data-fld=\"markets\" data-row=\"0\" data-fmt=\"int\">\u2014<\/span> markets \u00b7 one-minute data, Jan 2011 to Oct 2026 \u00b7 after spread, commission, slippage and overnight swaps \u00b7 report of 12 Nov 2026<\/p>\n  <p class=\"rp-lede\" id=\"takeaway\">After costs and swaps, at the <b data-draw=\"envlabel\">\u2014<\/b> drawdown envelope the mix made <b data-draw=\"val\" data-src=\"kpis\" data-fld=\"cagr_pct\" data-match=\"key={env}-base-insample\" data-fmt=\"pct\">\u2014<\/b> a year in 2011-22, <b data-draw=\"val\" data-src=\"kpis\" data-fld=\"cagr_pct\" data-match=\"key={env}-base-seen\" data-fmt=\"pct\">\u2014<\/b> a year in 2023-25 and <b data-draw=\"val\" data-src=\"kpis\" data-fld=\"total_pct\" data-match=\"key={env}-base-oos\" data-fmt=\"pct\">\u2014<\/b> in Jan-Oct 2026. <span data-draw=\"val\" data-src=\"years_positive\" data-fld=\"positive_{envk}\" data-row=\"0\" data-fmt=\"int\">\u2014<\/span> of <span data-draw=\"val\" data-src=\"years_positive\" data-fld=\"years\" data-row=\"0\" data-fmt=\"int\">\u2014<\/span> calendar years from 2011 to 2025 ended positive. <span data-verdict=\"below\">The owner's goal of <span data-draw=\"goal\">\u2014<\/span> a year is out of reach at this envelope.<\/span><span data-verdict=\"within\" hidden>The owner's goal of <span data-draw=\"goal\">\u2014<\/span> a year is within reach at this envelope.<\/span><span data-draw=\"verdict\"><\/span><\/p>\n<\/header>\n\n<div class=\"rp-filters\" id=\"filters\">\n  <span class=\"rp-flabel\" id=\"env-label\">Drawdown envelope<\/span>\n  <select class=\"dash-select rp-env\" aria-labelledby=\"env-label\">\n    <option value=\"3.6\">3.6% (the owner's cap)<\/option>\n    <option value=\"8\">8% (outside the cap)<\/option>\n  <\/select>\n  <span class=\"rp-sub\">Every trade risks a fixed share of equity, set on 2011-22 so that 95% of simulated 36-fortnight lifecycles stay inside this drawdown.<\/span>\n<\/div>\n\n<section class=\"rp-sec\" id=\"headline\">\n  <h2 class=\"rp-h2\">Headline, at the brokers' costs and swaps<\/h2>\n  <div class=\"rp-tiles\">\n    <div class=\"rp-card\" id=\"tile-insample\">\n      <div class=\"rp-tlabel\">Return a year, 2011-22<\/div>\n      <div class=\"rp-tvalue\" data-draw=\"val\" data-src=\"kpis\" data-fld=\"cagr_pct\" data-match=\"key={env}-base-insample\" data-fmt=\"pct\">\u2014<\/div>\n      <div class=\"rp-tsub\">In-sample \u00b7 Sharpe <span data-draw=\"val\" data-src=\"kpis\" data-fld=\"sharpe\" data-match=\"key={env}-base-insample\" data-fmt=\"n2\">\u2014<\/span><\/div>\n    <\/div>\n    <div class=\"rp-card\" id=\"tile-seen\">\n      <div class=\"rp-tlabel\">Return a year, 2023-25<\/div>\n      <div class=\"rp-tvalue\" data-draw=\"val\" data-src=\"kpis\" data-fld=\"cagr_pct\" data-match=\"key={env}-base-seen\" data-fmt=\"pct\">\u2014<\/div>\n      <div class=\"rp-tsub\">Seen before the mix was built \u00b7 Sharpe <span data-draw=\"val\" data-src=\"kpis\" data-fld=\"sharpe\" data-match=\"key={env}-base-seen\" data-fmt=\"n2\">\u2014<\/span><\/div>\n    <\/div>\n    <div class=\"rp-card\" id=\"tile-oos\">\n      <div class=\"rp-tlabel\">Return, Jan-Oct 2026<\/div>\n      <div class=\"rp-tvalue\" data-draw=\"val\" data-src=\"kpis\" data-fld=\"total_pct\" data-match=\"key={env}-base-oos\" data-fmt=\"pct\">\u2014<\/div>\n      <div class=\"rp-tsub\">Latest data \u00b7 Sharpe <span data-draw=\"val\" data-src=\"kpis\" data-fld=\"sharpe\" data-match=\"key={env}-base-oos\" data-fmt=\"n2\">\u2014<\/span><\/div>\n    <\/div>\n    <div class=\"rp-card\" id=\"tile-dd\">\n      <div class=\"rp-tlabel\">Worst drawdown, 2011-Oct 2026<\/div>\n      <div class=\"rp-tvalue\" data-draw=\"val\" data-src=\"kpis\" data-fld=\"max_dd_pct\" data-match=\"key={env}-base-all\" data-fmt=\"pu2\">\u2014<\/div>\n      <div class=\"rp-tsub\">Longest time under water <span data-draw=\"val\" data-src=\"kpis\" data-fld=\"longest_dd_days\" data-match=\"key={env}-base-all\" data-fmt=\"int\">\u2014<\/span> days<\/div>\n    <\/div>\n    <div class=\"rp-card\" id=\"tile-months\">\n      <div class=\"rp-tlabel\">Positive months, 2011-Oct 2026<\/div>\n      <div class=\"rp-tvalue\" data-draw=\"val\" data-src=\"kpis\" data-fld=\"pos_months_pct\" data-match=\"key={env}-base-all\" data-fmt=\"pu1\">\u2014<\/div>\n      <div class=\"rp-tsub\">Positive fortnights <span data-draw=\"val\" data-src=\"kpis\" data-fld=\"pos_fortnights_pct\" data-match=\"key={env}-base-all\" data-fmt=\"pu1\">\u2014<\/span><\/div>\n    <\/div>\n    <div class=\"rp-card\" id=\"tile-account\">\n      <div class=\"rp-tlabel\">Smallest account to run all legs<\/div>\n      <div class=\"rp-tvalue\" data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=min_acc_{envk}\" data-fmt=\"usd\">\u2014<\/div>\n      <div class=\"rp-tsub\">Cent account <span data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=min_acc_cent_{envk}\" data-fmt=\"usd\">\u2014<\/span><\/div>\n    <\/div>\n  <\/div>\n  <p class=\"rp-note\">About 2026: the older legs never used 2026 to set a rule or a weight. The three v2 legs (EURGBP H1, NAS100 H1, GBPUSD M15) were kept after a logged look at 2023-25 and Jan-Oct 2026, so 2026 is not a clean test for them, and NAS100 has no 2026 data, so that leg is idle there. 2023-25 was looked at for every leg before this mix was put together.<\/p>\n<\/section>\n\n<section class=\"rp-sec\" id=\"performance\">\n  <h2 class=\"rp-h2\">Performance by cost profile and period<\/h2>\n  <p class=\"rp-p\">Base is the brokers' costs and swaps: Exness Zero for the older legs, RoboForex Prime for the v2 legs. Swap-free removes overnight swaps and counts only if the account really is swap-free, which is not confirmed. Stress multiplies costs by 1.5 and swaps by 2. No costs is for reference only.<\/p>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-kpis\" data-source=\"kpis\" data-row-key=\"key\" aria-label=\"Performance by cost profile and period\">\n      <thead><tr>\n        <th class=\"l\" data-field=\"profile\">Costs<\/th><th class=\"l\" data-field=\"period\">Period<\/th><th data-field=\"cagr_pct\">Return a year<\/th><th data-field=\"total_pct\">Total return<\/th><th data-field=\"sharpe\">Sharpe<\/th><th data-field=\"sortino\">Sortino<\/th><th data-field=\"max_dd_pct\">Worst drawdown<\/th><th data-field=\"calmar\">Calmar<\/th><th data-field=\"longest_dd_days\">Longest drawdown, days<\/th><th data-field=\"pos_months_pct\">Positive months<\/th><th data-field=\"pos_fortnights_pct\">Positive fortnights<\/th><th data-field=\"mean_fortnight_pct\">Average fortnight<\/th><th data-field=\"worst_fortnight_pct\">Worst fortnight<\/th><th data-field=\"worst_month_pct\">Worst month<\/th><th data-field=\"vol_pct\">Volatility a year<\/th>\n      <\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"kpis\" data-filter=\"envelope={env}\" data-cols=\"profile:prof,period:per,cagr_pct:pct,total_pct:pct,sharpe:n2,sortino:n2,max_dd_pct:pu2,calmar:n2,longest_dd_days:int,pos_months_pct:pu1,pos_fortnights_pct:pu1,mean_fortnight_pct:pct3,worst_fortnight_pct:pct,worst_month_pct:pct,vol_pct:pu2\"><\/tbody>\n    <\/table>\n  <\/div>\n  <p class=\"rp-note\">Sharpe and Sortino use weekly returns scaled by the square root of 52. Calmar is the return a year divided by the worst drawdown. A fortnight is two calendar weeks; the average fortnight is what a fortnightly payout could take out.<\/p>\n<\/section>\n\n<section class=\"rp-sec\" id=\"equity\">\n  <h2 class=\"rp-h2\">Growth and drawdown, week by week<\/h2>\n  <figure class=\"rp-card\" id=\"fig-equity\" data-source=\"equity\">\n    <h3 class=\"rp-h3\">Growth of 1 (top) and drawdown from the last high (bottom)<\/h3>\n    <div class=\"rp-chart\" data-draw=\"equity\" style=\"min-height:430px\"><\/div>\n  <\/figure>\n  <p class=\"rp-note\">The envelope line is the 95% level of simulated 36-fortnight lifecycles, not a hard stop. The worst real drawdown from 2011 to Oct 2026 was <span data-draw=\"val\" data-src=\"kpis\" data-fld=\"max_dd_pct\" data-match=\"key={env}-base-all\" data-fmt=\"pu2\">\u2014<\/span>; drawdown beyond the envelope line is drawn in red. Shaded bands mark 2023-25 and 2026.<\/p>\n<\/section>\n\n<section class=\"rp-sec\" id=\"calendar\">\n  <h2 class=\"rp-h2\">Every year and every month<\/h2>\n  <figure class=\"rp-card\" id=\"fig-years\" data-source=\"yearly\">\n    <h3 class=\"rp-h3\">Return by calendar year<\/h3>\n    <div class=\"rp-chart\" data-draw=\"years\" style=\"min-height:230px\"><\/div>\n    <p class=\"rp-sub\">2026 covers January to October. Shaded: 2023-25 and 2026.<\/p>\n  <\/figure>\n  <figure class=\"rp-card\" id=\"fig-months\" data-source=\"monthly yearly\">\n    <h3 class=\"rp-h3\">Return by month, %<\/h3>\n    <div class=\"rp-legend\"><span><span class=\"rp-sw\" style=\"background:var(--color-ok)\"><\/span>gain<\/span><span><span class=\"rp-sw\" style=\"background:var(--color-bad)\"><\/span>loss<\/span><span>darker means larger \u00b7 last column is the calendar year<\/span><\/div>\n    <div class=\"rp-chart\" data-draw=\"months\" style=\"min-height:380px\"><\/div>\n  <\/figure>\n<\/section>\n\n<section class=\"rp-sec\" id=\"legs\">\n  <h2 class=\"rp-h2\">The legs<\/h2>\n  <p class=\"rp-p\">Each leg is one fixed rule on one market. A trade risks the base risk times the leg's weight. Weights were set on 2011-22 data and are not changed by later results.<\/p>\n  <figure class=\"rp-card\" id=\"fig-contrib\" data-source=\"legs\">\n    <h3 class=\"rp-h3\">Where the 2011-22 profit came from, weight \u00d7 total R<\/h3>\n    <div class=\"rp-chart\" data-draw=\"contrib\" style=\"min-height:320px\"><\/div>\n  <\/figure>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-legs\" data-source=\"legs\" data-row-key=\"leg\" aria-label=\"The legs, 2011-22\">\n      <thead><tr>\n        <th class=\"l\" data-field=\"name\">Leg<\/th><th class=\"l\" data-field=\"market\">Market<\/th><th class=\"l\" data-field=\"timeframe\">Timeframe<\/th><th data-field=\"weight\">Weight<\/th><th data-field=\"risk_pct_36\">Risk a trade at 3.6%<\/th><th data-field=\"trades\">Trades 2011-22<\/th><th data-field=\"per_month\">A month<\/th><th data-field=\"win_pct\">Win rate<\/th><th data-field=\"avg_win_R\">Average win, R<\/th><th data-field=\"avg_loss_R\">Average loss, R<\/th><th data-field=\"expectancy_R\">R a trade<\/th><th data-field=\"pf\">Profit factor<\/th><th data-field=\"cost_R\">Costs, R a trade<\/th><th data-field=\"swap_R\">Swaps, R a trade<\/th><th data-field=\"hold_h\">Median hold, hours<\/th><th data-field=\"later_R\">R a trade, 2023-Oct 2026<\/th><th data-field=\"later_trades\">Trades 2023-Oct 2026<\/th>\n      <\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"legs\" data-sort=\"-contribution_R\" data-cols=\"name:tl,market:tl,timeframe:tl,weight:n2,risk_pct_36:pu3,trades:int,per_month:n2,win_pct:pu1,avg_win_R:s2,avg_loss_R:s2,expectancy_R:s3,pf:n2,cost_R:n3,swap_R:n3,hold_h:n1,later_R:s3,later_trades:int\"><\/tbody>\n    <\/table>\n  <\/div>\n  <p class=\"rp-note\">R is a profit or loss in multiples of the amount risked. R a trade is after costs and swaps, which are shown separately. The 2023-Oct 2026 columns were seen when the v2 legs were kept.<\/p>\n<\/section>\n\n<section class=\"rp-sec\" id=\"correlation\">\n  <h2 class=\"rp-h2\">Diversification<\/h2>\n  <p class=\"rp-p\">The average correlation between two legs' daily results in 2011-22 was <b data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=avg_corr\" data-fmt=\"n3\">\u2014<\/b>. Legs that rarely move together are what turn many small edges into a smoother line than any one of them.<\/p>\n  <figure class=\"rp-card\" id=\"fig-corr\" data-source=\"correlation legs\">\n    <h3 class=\"rp-h3\">Correlation of daily results, 2011-22<\/h3>\n    <div class=\"rp-legend\"><span><span class=\"rp-sw\" data-sw=\"0\"><\/span>move together<\/span><span><span class=\"rp-sw\" data-sw=\"1\"><\/span>move opposite<\/span><span>darker means stronger \u00b7 column numbers match the row numbers<\/span><\/div>\n    <div class=\"rp-chart\" data-draw=\"corr\" style=\"min-height:360px\"><\/div>\n  <\/figure>\n<\/section>\n\n<section class=\"rp-sec\" id=\"montecarlo\">\n  <h2 class=\"rp-h2\">Monte Carlo at the 3.6% envelope<\/h2>\n  <p class=\"rp-p\">Each path draws fortnights of 2011-22 at random, with replacement: <span data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=mc_paths\" data-fmt=\"int\">\u2014<\/span> paths for one year (26 fortnights) and as many for one lifecycle (36 fortnights).<\/p>\n  <figure class=\"rp-card\" id=\"fig-mc\" data-source=\"montecarlo\">\n    <h3 class=\"rp-h3\">Return: 5th to 95th percentile, middle half shaded, median as a dot<\/h3>\n    <div class=\"rp-chart\" data-draw=\"mc\" style=\"min-height:150px\"><\/div>\n  <\/figure>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-mc\" data-source=\"montecarlo\" data-row-key=\"horizon\" aria-label=\"Monte Carlo percentiles\">\n      <thead><tr>\n        <th class=\"l\" data-field=\"horizon\">Horizon<\/th><th data-field=\"ret_p5\">Return, 5th pct<\/th><th data-field=\"ret_p25\">25th<\/th><th data-field=\"ret_p50\">Median<\/th><th data-field=\"ret_p75\">75th<\/th><th data-field=\"ret_p95\">95th<\/th><th data-field=\"dd_p50\">Worst drawdown, median<\/th><th data-field=\"dd_p95\">95th<\/th><th data-field=\"dd_p99\">99th<\/th><th data-field=\"p_loss_pct\">Chance of a loss<\/th><th data-field=\"p_dd_36_pct\">Chance drawdown over 3.6%<\/th><th data-field=\"p_dd_8_pct\">Over 8%<\/th>\n      <\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"montecarlo\" data-cols=\"horizon:hz,ret_p5:pct,ret_p25:pct,ret_p50:pct,ret_p75:pct,ret_p95:pct,dd_p50:pu2,dd_p95:pu2,dd_p99:pu2,p_loss_pct:pu2,p_dd_36_pct:pu2,p_dd_8_pct:pu2\"><\/tbody>\n    <\/table>\n  <\/div>\n  <p class=\"rp-note\">The paths reuse 2011-22, the data the legs were chosen on, so they carry its edge. 2023-25 and 2026 were weaker; read these ranges as the optimistic side.<\/p>\n<\/section>\n\n<section class=\"rp-sec\" id=\"account\">\n  <h2 class=\"rp-h2\">Account size and payouts<\/h2>\n  <div class=\"rp-tiles\">\n    <div class=\"rp-card\" id=\"tile-minacc\">\n      <div class=\"rp-tlabel\">Smallest standard account<\/div>\n      <div class=\"rp-tvalue\" data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=min_acc_{envk}\" data-fmt=\"usd\">\u2014<\/div>\n      <div class=\"rp-tsub\">Lots of 100,000 units, 0.01-lot steps<\/div>\n    <\/div>\n    <div class=\"rp-card\" id=\"tile-mincent\">\n      <div class=\"rp-tlabel\">Smallest cent account<\/div>\n      <div class=\"rp-tvalue\" data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=min_acc_cent_{envk}\" data-fmt=\"usd\">\u2014<\/div>\n      <div class=\"rp-tsub\">Cent lots are 100 times smaller<\/div>\n    <\/div>\n    <div class=\"rp-card\" id=\"tile-risk\">\n      <div class=\"rp-tlabel\">Base risk a trade<\/div>\n      <div class=\"rp-tvalue\" data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=risk_{envk}\" data-fmt=\"pu3\">\u2014<\/div>\n      <div class=\"rp-tsub\">of equity, times the leg's weight<\/div>\n    <\/div>\n  <\/div>\n  <p class=\"rp-p\">The smallest account is the one at which each leg's planned risk on a typical stop (its 75th-percentile stop) is at least twice what 0.01 lot would risk, so rounding to the broker's 0.01-lot step moves the risk of at least three trades in four by a quarter or less. The leg that needs the most sets the minimum. Contract sizes assumed: 100,000 units for FX, 100 ounces for gold, $1 a point for NAS100.<\/p>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-account\" data-source=\"account\" data-row-key=\"envelope,leg\" aria-label=\"Smallest account per leg\">\n      <thead><tr>\n        <th class=\"l\" data-field=\"leg\">Leg<\/th><th class=\"l\" data-field=\"market\">Market<\/th><th data-field=\"usd_per_001_lot\">USD risk of 0.01 lot, typical stop<\/th><th data-field=\"risk_pct\">Risk a trade<\/th><th data-field=\"min_account\">Smallest standard account<\/th><th data-field=\"min_account_cent\">Smallest cent account<\/th>\n      <\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"account\" data-filter=\"envelope={env}\" data-sort=\"-min_account\" data-cols=\"leg:legname,market:tl,usd_per_001_lot:n2,risk_pct:pu3,min_account:usd,min_account_cent:usd\"><\/tbody>\n    <\/table>\n  <\/div>\n  <h3 class=\"rp-h3\">Account needed for a payout every two weeks<\/h3>\n  <p class=\"rp-p\">Account = payout \u00f7 average fortnight return. Taking the profit out every fortnight stops compounding, and a losing fortnight pays nothing and has to be made back first.<\/p>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-payouts\" aria-label=\"Account needed for each fortnightly payout\">\n      <thead><tr><th class=\"l\">Payout every two weeks<\/th><th>At the 2011-22 pace<\/th><th>At the 2023-25 pace<\/th><th>At the Jan-Oct 2026 pace<\/th><\/tr><\/thead>\n      <tbody data-draw=\"payrows\"><\/tbody>\n    <\/table>\n  <\/div>\n<\/section>\n\n<section class=\"rp-sec\" id=\"examples\">\n  <h2 class=\"rp-h2\">Examples of the edge<\/h2>\n  <p class=\"rp-p\">Picked by rule, not by hand: the four legs that made the most in 2011-22, and for each its first winning and first losing trade of 2019. Times are UTC; prices are bid.<\/p>\n  <div class=\"rp-legend\"><span><span class=\"rp-sw\" data-sw=\"0\"><\/span>entry level, entry (ring) and exit (dot)<\/span><span><span class=\"rp-sw\" style=\"background:var(--cds-chart-status-critical)\"><\/span>stop<\/span><span>shaded: time in the trade<\/span><\/div>\n  <div class=\"rp-grid2\">\n    <figure class=\"rp-card\" id=\"ex1\" data-source=\"examples candles\">\n      <h3 class=\"rp-h3\">EURUSD Euro-hours short \u00b7 first win of 2019<\/h3>\n      <p class=\"rp-sub\">Sells at 09:00 London time, Tuesday to Thursday, and buys back at 13:00; stop at half the daily ATR.<\/p>\n      <p class=\"rp-sub\" data-draw=\"exinfo\" data-ex=\"ex1\">\u2014<\/p>\n      <div class=\"rp-chart\" data-draw=\"excandles\" data-ex=\"ex1\" style=\"min-height:230px\"><\/div>\n    <\/figure>\n    <figure class=\"rp-card\" id=\"ex2\" data-source=\"examples candles\">\n      <h3 class=\"rp-h3\">EURUSD Euro-hours short \u00b7 first loss of 2019<\/h3>\n      <p class=\"rp-sub\">Same rule: the exit is the 13:00 close unless the stop is hit first.<\/p>\n      <p class=\"rp-sub\" data-draw=\"exinfo\" data-ex=\"ex2\">\u2014<\/p>\n      <div class=\"rp-chart\" data-draw=\"excandles\" data-ex=\"ex2\" style=\"min-height:230px\"><\/div>\n    <\/figure>\n    <figure class=\"rp-card\" id=\"ex3\" data-source=\"examples candles\">\n      <h3 class=\"rp-h3\">USDJPY Tokyo fix, gotobi days \u00b7 first win of 2019<\/h3>\n      <p class=\"rp-sub\">Buys at 23:00 UTC before a Japanese settlement (gotobi) day and sells at 00:55 UTC, just before the Tokyo fix.<\/p>\n      <p class=\"rp-sub\" data-draw=\"exinfo\" data-ex=\"ex3\">\u2014<\/p>\n      <div class=\"rp-chart\" data-draw=\"excandles\" data-ex=\"ex3\" style=\"min-height:230px\"><\/div>\n    <\/figure>\n    <figure class=\"rp-card\" id=\"ex4\" data-source=\"examples candles\">\n      <h3 class=\"rp-h3\">USDJPY Tokyo fix, gotobi days \u00b7 first loss of 2019<\/h3>\n      <p class=\"rp-sub\">Same rule: the exit is at 00:55 UTC unless the stop is hit first.<\/p>\n      <p class=\"rp-sub\" data-draw=\"exinfo\" data-ex=\"ex4\">\u2014<\/p>\n      <div class=\"rp-chart\" data-draw=\"excandles\" data-ex=\"ex4\" style=\"min-height:230px\"><\/div>\n    <\/figure>\n    <figure class=\"rp-card\" id=\"ex5\" data-source=\"examples candles\">\n      <h3 class=\"rp-h3\">EURUSD close-beyond reversal \u00b7 first win of 2019<\/h3>\n      <p class=\"rp-sub\">After a daily candle closes beyond the previous day's range, a stop order back through that candle's far end for the next session; exit at the first profitable New York close (16:45-16:55), else a 250-pip stop. Shown on 4-hour candles.<\/p>\n      <p class=\"rp-sub\" data-draw=\"exinfo\" data-ex=\"ex5\">\u2014<\/p>\n      <div class=\"rp-chart\" data-draw=\"excandles\" data-ex=\"ex5\" style=\"min-height:230px\"><\/div>\n    <\/figure>\n    <figure class=\"rp-card\" id=\"ex6\" data-source=\"examples candles\">\n      <h3 class=\"rp-h3\">EURUSD close-beyond reversal \u00b7 first loss of 2019<\/h3>\n      <p class=\"rp-sub\">Same rule. Shown on 4-hour candles.<\/p>\n      <p class=\"rp-sub\" data-draw=\"exinfo\" data-ex=\"ex6\">\u2014<\/p>\n      <div class=\"rp-chart\" data-draw=\"excandles\" data-ex=\"ex6\" style=\"min-height:230px\"><\/div>\n    <\/figure>\n    <figure class=\"rp-card\" id=\"ex7\" data-source=\"examples candles\">\n      <h3 class=\"rp-h3\">Gold dip reversion (S1) \u00b7 first win of 2019<\/h3>\n      <p class=\"rp-sub\">The TimelessCity S1 rule on gold (H1, M30 and M20 settings). Shown on 30-minute candles.<\/p>\n      <p class=\"rp-sub\" data-draw=\"exinfo\" data-ex=\"ex7\">\u2014<\/p>\n      <div class=\"rp-chart\" data-draw=\"excandles\" data-ex=\"ex7\" style=\"min-height:230px\"><\/div>\n    <\/figure>\n    <figure class=\"rp-card\" id=\"ex8\" data-source=\"examples candles\">\n      <h3 class=\"rp-h3\">Gold dip reversion (S1) \u00b7 first loss of 2019<\/h3>\n      <p class=\"rp-sub\">Same rule. Shown on 30-minute candles.<\/p>\n      <p class=\"rp-sub\" data-draw=\"exinfo\" data-ex=\"ex8\">\u2014<\/p>\n      <div class=\"rp-chart\" data-draw=\"excandles\" data-ex=\"ex8\" style=\"min-height:230px\"><\/div>\n    <\/figure>\n  <\/div>\n<\/section>\n\n<section class=\"rp-sec\" id=\"pattern\">\n  <h2 class=\"rp-h2\">The pivot-sweep pattern, studied on one-minute data without costs <span class=\"rp-tag\" data-sverdict=\"rejected\">Rejected<\/span><span class=\"rp-tag ok\" data-sverdict=\"survivors\" hidden>Survivors found<\/span><span data-draw=\"studyverdict\"><\/span><\/h2>\n  <p class=\"rp-p\" id=\"pattern-summary\">The owner's setup (four candles right after a pivot sweep, entry at 60% of the range) was followed on <b data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=study_setups\" data-fmt=\"int\">\u2014<\/b> filled setups, 12 markets, 2011-22, with no spread, commission, slippage or swaps. Every target won about as often as chance predicts, and <b data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=study_tests_edge\" data-fmt=\"int\">\u2014<\/b> of <b data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=study_tests\" data-fmt=\"int\">\u2014<\/b> entry-condition tests found an edge that held in both 2011-15 and 2016-19. <b data-draw=\"val\" data-src=\"mc_count\" data-fld=\"survivors\" data-row=\"0\" data-fmt=\"int\">\u2014<\/b> of the <b data-draw=\"val\" data-src=\"mc_count\" data-fld=\"cells\" data-row=\"0\" data-fmt=\"int\">\u2014<\/b> cells that reached the Monte Carlo step survived it, so the pattern adds nothing to the portfolio and its 2023-26 data stays unopened.<\/p>\n\n  <div class=\"rp-grid2\">\n    <figure class=\"rp-card\" id=\"fig-payout-r\" data-source=\"study_payout\">\n      <h3 class=\"rp-h3\">R per 10 trades for each exit, 2011-15<\/h3>\n      <div class=\"rp-chart\" data-draw=\"payr\" style=\"min-height:330px\"><\/div>\n    <\/figure>\n    <figure class=\"rp-card\" id=\"fig-payout-w\" data-source=\"study_payout\">\n      <h3 class=\"rp-h3\">Wins per 10 trades: measured and chance, 2011-15<\/h3>\n      <div class=\"rp-legend\"><span><span class=\"rp-sw\" data-sw=\"0\" style=\"border-radius:50%\"><\/span>measured<\/span><span><span class=\"rp-ring\"><\/span>chance<\/span><\/div>\n      <div class=\"rp-chart\" data-draw=\"payw\" style=\"min-height:260px\"><\/div>\n    <\/figure>\n  <\/div>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-payout\" data-source=\"study_payout\" data-row-key=\"structure\" aria-label=\"Pattern study: exits\">\n      <thead><tr>\n        <th class=\"l\" data-field=\"structure\">Exit<\/th><th data-field=\"wins_per_10\">Wins per 10<\/th><th data-field=\"chance_per_10\">Chance per 10<\/th><th data-field=\"avg_win_R\">Average win, R<\/th><th data-field=\"R_per_10\">R per 10 trades<\/th><th data-field=\"E_learn\">R a trade, 2011-15<\/th><th data-field=\"E_confirm\">2016-19<\/th><th data-field=\"E_validate\">2020-22<\/th><th data-field=\"losing_streak\">Longest losing run<\/th>\n      <\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"study_payout\" data-cols=\"structure:tl,wins_per_10:n2,chance_per_10:n2,avg_win_R:n2,R_per_10:s2,E_learn:s4,E_confirm:s4,E_validate:s4,losing_streak:int\"><\/tbody>\n    <\/table>\n  <\/div>\n  <p class=\"rp-note\">nR is a fixed target n times the risk. BE75 moves the stop to the entry once price has covered 75% of the way to the target. TP1 and TP2 are the first and second live pivots past the entry. P60 closes 60% at TP1 and the rest at TP2, with the stop at entry after TP1. Chance is how often a target comes first if price moves at random: 1 in (1 + n), or 0.75 in (1 + 0.75n) with BE75.<\/p>\n\n  <h3 class=\"rp-h3\">Why a few big winners do not make a profitable year<\/h3>\n  <p class=\"rp-p\">With TP2 as the only target, a winning trade paid <b data-draw=\"val\" data-src=\"study_payout\" data-fld=\"avg_win_R\" data-match=\"structure=TP2\" data-fmt=\"n2\">\u2014<\/b>R on average, but only <b data-draw=\"val\" data-src=\"study_payout\" data-fld=\"wins_per_10\" data-match=\"structure=TP2\" data-fmt=\"n2\">\u2014<\/b> trades in 10 won and each of the others lost 1R. Per 10 trades that came to <b data-draw=\"val\" data-src=\"study_payout\" data-fld=\"R_per_10\" data-match=\"structure=TP2\" data-fmt=\"s2\">\u2014<\/b>R. The big winners on a chart are real, but so are the losers around them, and a rule earns on all of its trades, not on the ones that are shown.<\/p>\n\n  <h3 class=\"rp-h3\">Is one-minute data good enough? Checked against ticks<\/h3>\n  <p class=\"rp-p\">The same setups on EURUSD, GBPUSD and XAUUSD in March 2021, September 2021 and June 2022 were re-run tick by tick from Exness's public tick archive.<\/p>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-tick\" data-source=\"study_tick\" data-row-key=\"structure\" aria-label=\"One-minute bars against ticks\">\n      <thead><tr><th class=\"l\" data-field=\"structure\">Exit<\/th><th data-field=\"win_m1_pct\">Win rate, one-minute bars<\/th><th data-field=\"win_tick_pct\">Win rate, ticks<\/th><th data-field=\"n\">Trades<\/th><\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"study_tick\" data-cols=\"structure:tl,win_m1_pct:pu1,win_tick_pct:pu1,n:int\"><\/tbody>\n    <\/table>\n  <\/div>\n\n  <h3 class=\"rp-h3\">Entry conditions: the owner's questions<\/h3>\n  <p class=\"rp-p\">R a trade with a 20R target (the exit chosen on 2011-15), no costs. \"Loses less\" means better than the other setups by a t-statistic of at least 3 in 2011-15 and 2 in 2016-19; \"edge\" means above zero by the same bars; 2020-22 is shown but never used to choose.<\/p>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-questions\" data-source=\"study_questions\" data-row-key=\"id\" aria-label=\"Entry conditions\">\n      <thead><tr><th class=\"l\" data-field=\"condition\">Condition<\/th><th data-field=\"trades_learn\">Trades 2011-15<\/th><th data-field=\"E_learn\">R a trade, 2011-15<\/th><th data-field=\"E_confirm\">2016-19<\/th><th data-field=\"E_validate\">2020-22<\/th><th class=\"l\" data-field=\"verdict\">Verdict<\/th><\/tr><\/thead>\n      <tbody data-draw=\"qrows\"><\/tbody>\n    <\/table>\n  <\/div>\n  <p class=\"rp-note\">A sweep by candle 4 was above zero in all three periods, but on only <span data-draw=\"val\" data-src=\"study_questions\" data-fld=\"trades_learn\" data-match=\"id=q1\" data-fmt=\"int\">\u2014<\/span> trades in 2011-15; among <span data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=study_tests\" data-fmt=\"int\">\u2014<\/span> tests a result like that is expected by luck. It is logged as a question to watch, not a rule.<\/p>\n\n  <figure class=\"rp-card\" id=\"fig-smd\" data-source=\"study_features\">\n    <h3 class=\"rp-h3\">Winners against losers: how different were they before the entry?<\/h3>\n    <p class=\"rp-sub\">Standardised difference of the average, 2011-15. <span data-draw=\"smdbar\">\u2014<\/span> is the usual bar for even a small effect.<\/p>\n    <div class=\"rp-chart\" data-draw=\"smd\" style=\"min-height:420px\"><\/div>\n  <\/figure>\n\n  <h3 class=\"rp-h3\">Why the losers lose<\/h3>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-losers\" data-source=\"study_losers\" data-row-key=\"id\" aria-label=\"Losing trades\">\n      <thead><tr><th class=\"l\" data-field=\"category\">Losing trades that\u2026<\/th><th data-field=\"learn\">2011-15<\/th><th data-field=\"confirm\">2016-19<\/th><th data-field=\"validate\">2020-22<\/th><\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"study_losers\" data-cols=\"category:tl,learn:pu1,confirm:pu1,validate:pu1\"><\/tbody>\n    <\/table>\n  <\/div>\n  <p class=\"rp-note\">Losers were mostly not near-misses: <span data-draw=\"val\" data-src=\"study_losers\" data-fld=\"learn\" data-match=\"id=l5\" data-fmt=\"pu1\">\u2014<\/span> ran 3R or more beyond the stop first (2011-15), and only <span data-draw=\"val\" data-src=\"study_losers\" data-fld=\"learn\" data-match=\"id=l4\" data-fmt=\"pu1\">\u2014<\/span> were wick stops that a slightly wider stop would have saved. Many reached TP1 later, but only after the stop had been hit.<\/p>\n\n  <h3 class=\"rp-h3\">The scanner, every timeframe, without and with costs<\/h3>\n  <p class=\"rp-p\">The scanner kept the conditions that lost less in both 2011-15 and 2016-19, with a 20R target, and was then run on all 12 markets and six timeframes through the Truth Lab (development 2011-19, validation 2020-22). With costs means RoboForex Prime spread and commission plus slippage on stops.<\/p>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-scanner\" data-source=\"study_scanner\" data-row-key=\"step\" aria-label=\"Scanner steps\">\n      <thead><tr><th data-field=\"step\">Step<\/th><th class=\"l\" data-field=\"condition\">Condition added<\/th><th data-field=\"trades_learn\">Trades 2011-15<\/th><th data-field=\"E_learn\">R a trade, 2011-15<\/th><th data-field=\"E_confirm\">2016-19<\/th><th data-field=\"E_validate\">2020-22<\/th><\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"study_scanner\" data-cols=\"step:int,condition:tl,trades_learn:int,E_learn:s4,E_confirm:s4,E_validate:s4\"><\/tbody>\n    <\/table>\n  <\/div>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-tf\" data-source=\"study_timeframes\" data-row-key=\"tf\" aria-label=\"Scanner by timeframe\">\n      <thead><tr><th class=\"l\" data-field=\"tf\">Timeframe<\/th><th data-field=\"trades\">Trades 2011-19<\/th><th data-field=\"zero_dev\">No costs, R a trade 2011-19<\/th><th data-field=\"zero_val\">No costs, 2020-22<\/th><th data-field=\"cost_dev\">With costs, 2011-19<\/th><th data-field=\"cost_val\">With costs, 2020-22<\/th><th data-field=\"markets_positive_after_costs\">Markets positive after costs, 2011-19<\/th><\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"study_timeframes\" data-cols=\"tf:tl,trades:int,zero_dev:s4,zero_val:s4,cost_dev:s4,cost_val:s4,markets_positive_after_costs:int\"><\/tbody>\n    <\/table>\n  <\/div>\n  <h3 class=\"rp-h3\">Monte Carlo of the cells that passed the era rule<\/h3>\n  <p class=\"rp-p\">A cell passed the era rule if it was positive after costs in each of 2011-14, 2015-18 and 2019-22 with 20 or more trades in each. To survive the Monte Carlo (one-year paths at 1% risk) it needed a losing year in at most 1 path in 5 and a median worst drawdown within the year of 10% or less.<\/p>\n  <div class=\"rp-scroll\">\n    <table class=\"rp-table\" id=\"tbl-smc\" data-source=\"study_mc\" data-row-key=\"cell\" aria-label=\"Monte Carlo of the era-rule cells\">\n      <thead><tr><th class=\"l\" data-field=\"cell\">Cell<\/th><th data-field=\"trades_per_year\">Trades a year<\/th><th data-field=\"p_losing_year_pct\">Chance of a losing year<\/th><th data-field=\"median_year_pct\">Median year<\/th><th data-field=\"p5_year_pct\">Bad year (5th pct)<\/th><th data-field=\"median_maxdd_pct\">Median worst drawdown<\/th><th class=\"l\" data-field=\"survives\">Survives<\/th><\/tr><\/thead>\n      <tbody data-draw=\"rows\" data-src=\"study_mc\" data-cols=\"cell:tl,trades_per_year:int,p_losing_year_pct:pu1,median_year_pct:pct,p5_year_pct:pct,median_maxdd_pct:pu2,survives:tl\"><\/tbody>\n    <\/table>\n  <\/div>\n<\/section>\n\n<section class=\"rp-sec\" id=\"method\">\n  <details class=\"rp-details\">\n    <summary>Method, data, costs and what is not yet proven<\/summary>\n    <ul>\n      <li><b>Data.<\/b> One-minute bid bars from 2011 to 2025; EURGBP, NAS100 and the other HistData markets were clock-corrected for daylight saving. Jan-Oct 2026 comes from Exness's public tick archive. All times are UTC.<\/li>\n      <li><b>Costs.<\/b> Older legs: Exness Zero, with spreads measured from Exness's tick archive and commission taken at the high end of published rates. v2 legs: RoboForex Prime published spreads and commission. Slippage is added on stops. Overnight swaps are charged for every night a trade is held. The stress profile multiplies costs by 1.5 and swaps by 2.<\/li>\n      <li><b>Sizing.<\/b> Fixed fraction: each trade risks the base risk times its leg's weight, of current equity, compounding daily. Profit or loss is booked on the exit day. The base risk was set on 2011-22 so that 95% of bootstrapped 36-fortnight lifecycles stay within the envelope.<\/li>\n      <li><b>Periods.<\/b> 2011-22 is in-sample: the legs, weights and base risk were chosen on it. 2023-25 had been looked at for every leg before the mix was built. Jan-Oct 2026 was never used to set a rule or a weight of the older legs; the v2 legs were kept after a look that included it.<\/li>\n      <li><b>How hard the search was.<\/b> The legs are survivors of <span data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=configs_tried\" data-fmt=\"int\">\u2014<\/span> configurations across <span data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=ideas_tested\" data-fmt=\"int\">\u2014<\/span> ideas tested in this project; the v2 legs were picked from <span data-draw=\"val\" data-src=\"headline\" data-fld=\"value\" data-match=\"metric=v2_cells\" data-fmt=\"int\">\u2014<\/span> cells. A heavily searched backtest usually runs 30 to 50% weaker live, so treat the in-sample figures as an upper bound.<\/li>\n      <li><b>Statistics.<\/b> Sharpe and Sortino from weekly returns times the square root of 52; drawdowns on daily equity; Calmar = return a year \u00f7 worst drawdown; correlations on daily results.<\/li>\n      <li><b>Not yet proven.<\/b> There is no live or demo record. Most legs have no Expert Advisor yet (TimelessCity covers the gold S1 leg; the rest exist as research code). The account's real costs and swap status need exporting from the account and the mix re-scored before money is risked, followed by 3 to 6 months on demo.<\/li>\n    <\/ul>\n  <\/details>\n<\/section>\n\n<\/div>\n\n<script>\n(function () {\n  'use strict';\n  var LOC = d3.formatLocale({decimal: '.', thousands: ',', grouping: [3], currency: ['$', ''], minus: '-'});\n  var GOAL = {lo: 60, hi: 120};      // the owner's goal, % a year\n  var SMD_SMALL = 0.2;               // the usual bar for a small effect\n  var PD = d3.utcParse('%Y-%m-%d');\n  var FD = d3.utcFormat('%-d %b %Y');\n  var isNum = function (v) { return v !== null && v !== undefined && v !== '' && !isNaN(+v); };\n  var fx = function (d, v) { return LOC.format('.' + d + 'f')(+v); };\n  var sg = function (d, v) { return (+v > 0 ? '+' : '') + fx(d, v); };\n  var PROF = {base: 'Base', swapfree: 'Swap-free', stress: 'Stress', nocosts: 'No costs'};\n  var PER = {insample: '2011-22', seen: '2023-25', oos: 'Jan-Oct 2026', all: '2011-Oct 2026'};\n  var HZ = {year: 'One year (26 fortnights)', lifecycle: 'Lifecycle (36 fortnights)'};\n  var LEGNAME = {};\n  var FMT = {\n    tl: function (v) { return v == null ? '' : String(v); },\n    int: function (v) { return isNum(v) ? LOC.format(',.0f')(+v) : '\u2014'; },\n    n1: function (v) { return isNum(v) ? fx(1, v) : '\u2014'; },\n    n2: function (v) { return isNum(v) ? fx(2, v) : '\u2014'; },\n    n3: function (v) { return isNum(v) ? fx(3, v) : '\u2014'; },\n    s2: function (v) { return isNum(v) ? sg(2, v) : '\u2014'; },\n    s3: function (v) { return isNum(v) ? sg(3, v) : '\u2014'; },\n    s4: function (v) { return isNum(v) ? sg(4, v) : '\u2014'; },\n    pct: function (v) { return isNum(v) ? sg(2, v) + '%' : '\u2014'; },\n    pct3: function (v) { return isNum(v) ? sg(3, v) + '%' : '\u2014'; },\n    pu1: function (v) { return isNum(v) ? fx(1, v) + '%' : '\u2014'; },\n    pu2: function (v) { return isNum(v) ? fx(2, v) + '%' : '\u2014'; },\n    pu3: function (v) { return isNum(v) ? fx(3, v) + '%' : '\u2014'; },\n    usd: function (v) { return isNum(v) ? '$' + LOC.format(',.0f')(+v) : '\u2014'; },\n    prof: function (v) { return PROF[v] || String(v); },\n    per: function (v) { return PER[v] || String(v); },\n    hz: function (v) { return HZ[v] || String(v); },\n    legname: function (v) { return LEGNAME[v] || String(v); }\n  };\n  var LEFT = {tl: 1, prof: 1, per: 1, hz: 1, legname: 1};\n  var C = function (i) { return (dash.colors && dash.colors[i]) || 'var(--color-fg)'; };\n  var params = function () { return (dash.params && dash.params()) || {}; };\n  var env = function () { return String(params().env == null ? '3.6' : params().env) === '8' ? '8' : '3.6'; };\n  var envk = function () { return env() === '8' ? '8' : '36'; };\n  var sub = function (s) { return String(s || '').replace(/\\{env\\}/g, env()).replace(/\\{envk\\}/g, envk()); };\n  var enc = function (v) { return String(v).replace(/%/g, '%25').replace(/&/g, '%26').replace(/=/g, '%3D').replace(/,/g, '%2C'); };\n  var parseMatch = function (s) { var o = {}; sub(s).split('&').forEach(function (p) { var i = p.indexOf('='); o[p.slice(0, i)] = p.slice(i + 1); }); return o; };\n  var matches = function (row, w) { return Object.keys(w).every(function (k) { return String(row[k]) === w[k]; }); };\n\n  function mk(tag, source, field, where, text, cls) {\n    var e = document.createElement(tag);\n    if (cls) e.className = cls;\n    if (source) e.setAttribute('data-source', source);\n    if (field) e.setAttribute('data-field', field);\n    if (typeof where === 'number') e.setAttribute('data-row', String(where));\n    else if (where) e.setAttribute('data-where', Object.keys(where).map(function (k) { return enc(k) + '=' + enc(where[k]); }).join('&'));\n    e.textContent = text;\n    return e;\n  }\n  function failed(el, status) {\n    el.classList.toggle('dash-skeleton', status === 'loading');\n    var p = document.createElement('div');\n    p.className = 'rp-sub';\n    p.textContent = status === 'error' ? 'Failed to load' : '\u2014';\n    el.replaceChildren(p);\n  }\n  function chart(el, H, label) {\n    el.classList.remove('dash-skeleton');\n    el.replaceChildren();\n    var W = Math.max(260, Math.floor(el.clientWidth || 640));\n    var svg = d3.select(el).append('svg').attr('width', W).attr('height', H).attr('viewBox', '0 0 ' + W + ' ' + H)\n      .style('width', '100%').style('height', 'auto').attr('role', 'img').attr('aria-label', label);\n    var tip = d3.select(el).append('div').attr('class', 'rp-tip');\n    return {W: W, svg: svg, tip: tip};\n  }\n  function textWidth(svg, list) {\n    var g = svg.append('g').attr('opacity', 0), w = 0;\n    list.forEach(function (s) {\n      var t = g.append('text').text(s), L = t.node().getComputedTextLength();\n      w = Math.max(w, L > 0 ? L : String(s).length * 6.6);\n    });\n    g.remove();\n    return w;\n  }\n  function tipShow(el, tip, lines, px, py) {\n    var n = tip.node();\n    n.replaceChildren();\n    lines.forEach(function (ln) {\n      var row = document.createElement('div');\n      if (ln.length === 1) { var b = document.createElement('b'); b.textContent = ln[0]; row.appendChild(b); }\n      else { var k = document.createElement('span'); k.className = 'k'; k.textContent = ln[0] + ' '; var v = document.createElement('span'); v.textContent = ln[1]; row.appendChild(k); row.appendChild(v); }\n      n.appendChild(row);\n    });\n    n.style.display = 'block';\n    var W = el.clientWidth, w = n.offsetWidth, h = n.offsetHeight;\n    var x = px + 14; if (x + w > W) x = px - w - 14; if (x < 0) x = Math.max(0, W - w);\n    var y = py - h - 10; if (y < 0) y = py + 16;\n    n.style.left = x + 'px'; n.style.top = y + 'px';\n  }\n  function tipHide(tip) { tip.node().style.display = 'none'; }\n  function hoverRect(svg, el, tip, x, y, w, h, lines) {\n    svg.append('rect').attr('x', x).attr('y', y).attr('width', Math.max(1, w)).attr('height', Math.max(1, h)).style('fill', 'transparent')\n      .on('pointermove', function (ev) { var p = d3.pointer(ev, el); tipShow(el, tip, lines, p[0], p[1]); })\n      .on('pointerleave', function () { tipHide(tip); });\n  }\n  function barV(x, w, y0, y1, r) {\n    var h = Math.abs(y1 - y0); r = Math.max(0, Math.min(r, w / 2, h));\n    if (y1 <= y0) return 'M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 + r) + 'V' + y0 + 'Z';\n    return 'M' + x + ',' + y0 + 'V' + (y1 - r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 - r) + 'V' + y0 + 'Z';\n  }\n  function barH(y, h, x0, x1, r) {\n    var w = Math.abs(x1 - x0); r = Math.max(0, Math.min(r, h / 2, w));\n    if (x1 >= x0) return 'M' + x0 + ',' + y + 'H' + (x1 - r) + 'Q' + x1 + ',' + y + ' ' + x1 + ',' + (y + r) + 'V' + (y + h - r) + 'Q' + x1 + ',' + (y + h) + ' ' + (x1 - r) + ',' + (y + h) + 'H' + x0 + 'Z';\n    return 'M' + x0 + ',' + y + 'H' + (x1 + r) + 'Q' + x1 + ',' + y + ' ' + x1 + ',' + (y + r) + 'V' + (y + h - r) + 'Q' + x1 + ',' + (y + h) + ' ' + (x1 + r) + ',' + (y + h) + 'H' + x0 + 'Z';\n  }\n  function hline(svg, x1, x2, y, color, width, dash_) {\n    var l = svg.append('line').attr('x1', x1).attr('x2', x2).attr('y1', y).attr('y2', y).style('stroke', color).style('stroke-width', width || 1);\n    if (dash_) l.style('stroke-dasharray', dash_);\n    return l;\n  }\n\n  // ---- calculations readers can inspect ----\n  dash.calc('years_positive', {\n    title: 'Positive calendar years, 2011-25',\n    description: 'How many calendar years from 2011 to 2025 ended with a gain, at each envelope.',\n    inputs: ['yearly'],\n    fn: function (yearly) {\n      var full = yearly.filter(function (r) { return +r.year >= 2011 && +r.year <= 2025; });\n      return [{years: full.length,\n        positive_36: full.filter(function (r) { return +r.ret_36 > 0; }).length,\n        positive_8: full.filter(function (r) { return +r.ret_8 > 0; }).length}];\n    }\n  });\n  dash.calc('leg_markets', {\n    title: 'Markets traded',\n    description: 'How many different markets the legs trade.',\n    inputs: ['legs'],\n    fn: function (legs) { var s = {}; legs.forEach(function (r) { s[r.market] = 1; }); return [{markets: Object.keys(s).length}]; }\n  });\n  dash.calc('mc_count', {\n    title: 'Pattern study: cells tested by Monte Carlo',\n    description: 'How many pattern-study cells reached the Monte Carlo step, and how many survived it.',\n    inputs: ['study_mc'],\n    fn: function (study_mc) { return [{cells: study_mc.length, survivors: study_mc.filter(function (r) { return r.survives === 'yes'; }).length}]; }\n  });\n\n  // ---- controls ----\n  document.querySelectorAll('.rp-env').forEach(function (sel) {\n    sel.value = env();\n    sel.addEventListener('change', function () { dash.setParams({env: sel.value}); });\n  });\n  dash.onData(function () {\n    document.querySelectorAll('.rp-env').forEach(function (sel) { if (document.activeElement !== sel) sel.value = env(); });\n  });\n  document.querySelectorAll('[data-sw]').forEach(function (s) { s.style.background = C(+s.getAttribute('data-sw')); });\n\n  // ---- words and single values ----\n  dash.draw('val', function (el) {\n    var src = el.getAttribute('data-src'), fld = sub(el.getAttribute('data-fld')), fmt = FMT[el.getAttribute('data-fmt')] || FMT.tl;\n    var d = dash.data(src);\n    el.classList.toggle('dash-skeleton', d.status === 'loading');\n    if (d.status !== 'ok' || !Array.isArray(d.data)) { el.textContent = '\u2014'; return; }\n    var r, w;\n    if (el.hasAttribute('data-row')) { w = +el.getAttribute('data-row'); r = d.data[w]; }\n    else { w = parseMatch(el.getAttribute('data-match')); r = d.data.find(function (row) { return matches(row, w); }); }\n    el.replaceChildren(mk('span', src, fld, w, r ? fmt(r[fld]) : '\u2014'));\n  });\n  dash.draw('envlabel', function (el) { el.textContent = env() + '%'; });\n  dash.draw('goal', function (el) { el.textContent = GOAL.lo + '-' + GOAL.hi + '%'; });\n  dash.draw('smdbar', function (el) { el.textContent = String(SMD_SMALL); });\n  dash.draw('verdict', function (el) {\n    var d = dash.data('kpis');\n    var r = d.status === 'ok' ? d.data.find(function (x) { return x.key === env() + '-base-insample'; }) : null;\n    var below = !r || +r.cagr_pct < GOAL.lo;\n    document.querySelectorAll('[data-verdict]').forEach(function (s) { s.hidden = (s.getAttribute('data-verdict') === 'below') !== below; });\n    el.textContent = '';\n  });\n  dash.draw('studyverdict', function (el) {\n    var d = dash.data('mc_count');\n    var none = !(d.status === 'ok' && d.data && d.data[0]) || +d.data[0].survivors === 0;\n    document.querySelectorAll('[data-sverdict]').forEach(function (s) { s.hidden = (s.getAttribute('data-sverdict') === 'rejected') !== none; });\n    el.textContent = '';\n  });\n\n  // ---- tables of rows ----\n  dash.draw('rows', function (tb) {\n    var src = tb.getAttribute('data-src');\n    var d = dash.data(src);\n    if (d.status !== 'ok' || !Array.isArray(d.data)) { tb.replaceChildren(); return; }\n    var cols = tb.getAttribute('data-cols').split(',').map(function (c) { var p = c.split(':'); return {f: p[0], t: p[1] || 'tl'}; });\n    if (cols.some(function (c) { return c.t === 'legname'; })) {\n      var dl = dash.data('legs');\n      if (dl.status === 'ok') dl.data.forEach(function (r) { LEGNAME[r.leg] = r.name; });\n    }\n    var data = d.data.slice();\n    var flt = tb.getAttribute('data-filter');\n    if (flt) { var w = parseMatch(flt); data = data.filter(function (r) { return matches(r, w); }); }\n    var srt = tb.getAttribute('data-sort');\n    if (srt) { var desc = srt.charAt(0) === '-', k = srt.replace(/^-/, ''); data.sort(function (a, b) { r
